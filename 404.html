<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpetDev Portfolio</title>
    <script>
        (function() {
            var path = window.location.pathname;
            var pathLower = path.toLowerCase();
            if (pathLower.includes('doomjaja')) {
                window.location.replace('/?game=delicia_doom#doomjaja');
            } else if (pathLower.includes('/journal/')) {
                window.location.replace(path + window.location.search + window.location.hash);
            } else if (pathLower.includes('/tools/')) {
                window.location.replace(path + window.location.search + window.location.hash);
            } else {
                window.location.replace('/' + window.location.search + window.location.hash);
            }
        })();
    </script>
</head>
<body style="background-color: #050505; color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecionando...</p>
</body>
</html>
