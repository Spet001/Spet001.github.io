<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduardo Gelain | Journal</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#00aaff',
                        primaryHover: '#0077b6',
                        dark: '#050505',
                        darkPanel: 'rgba(15, 23, 42, 0.7)',
                    }
                }
            }
        }
    </script>
    
    <!-- Marked.js for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for sanitizing HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
        .markdown-body h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 1rem; color: #fff; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.75rem; color: #fff; }
        .markdown-body h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #e2e8f0; }
        .markdown-body p { margin-bottom: 1rem; line-height: 1.75; }
        .markdown-body a { color: #00aaff; text-decoration: underline; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body blockquote { border-left: 4px solid #334155; padding-left: 1rem; color: #94a3b8; font-style: italic; }
        .markdown-body code { background-color: #1e293b; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875em; }
        .markdown-body pre { background-color: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #1e293b; }
        .markdown-body pre code { background-color: transparent; padding: 0; color: #e2e8f0; }
        .markdown-body img { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; }
        .markdown-body hr { border-color: #1e293b; margin: 2rem 0; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>

<body class="antialiased selection:bg-primary selection:text-white flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-xl font-bold tracking-tighter text-white">
                <i class="fas fa-terminal text-primary"></i>
                <span>Spet<span class="text-primary">Dev</span></span>
            </a>
            <div class="flex items-center gap-6 text-sm font-medium text-slate-300">
                <a href="/" class="hover:text-primary transition-colors">Home</a>
                <a href="/journal" class="font-bold text-primary">Journal</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-24 pb-12 px-6">
        <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8">
            
            <!-- Sidebar -->
            <aside class="md:col-span-1">
                <div class="glass-panel rounded-2xl p-6 sticky top-24">
                    <h2 class="text-lg font-bold text-white mb-4 border-b border-slate-700 pb-2">Posts</h2>
                    <ul id="entries-list" class="space-y-3">
                        <li class="text-slate-400 text-sm italic">Loading...</li>
                    </ul>
                </div>
            </aside>

            <!-- Article Content -->
            <article class="md:col-span-3 glass-panel rounded-2xl p-8 md:p-12 min-h-[60vh]">
                <div id="content" class="markdown-body">
                    <h1 class="text-center text-slate-500 mt-10">Select a post</h1>
                </div>
            </article>

        </div>
    </main>

    <script>
        // Load entries.json and render the sidebar
        async function init() {
            try {
                const response = await fetch('entries.json');
                if (!response.ok) throw new Error('Could not load entries.json');
                const entries = await response.json();
                
                const listEl = document.getElementById('entries-list');
                listEl.innerHTML = '';
                
                if (entries.length === 0) {
                    listEl.innerHTML = '<li class="text-slate-500 text-sm">No posts found.</li>';
                    return;
                }

                entries.forEach((entry, idx) => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `#${entry.file}`;
                    a.className = 'block text-slate-400 hover:text-primary transition-colors cursor-pointer p-2 rounded-lg hover:bg-slate-800/50';
                    a.innerHTML = `<div class="font-medium text-white">${entry.title}</div><div class="text-xs text-slate-500 mt-1">${entry.date}</div>`;
                    
                    a.onclick = (e) => {
                        e.preventDefault();
                        window.location.hash = encodeURIComponent(entry.file);
                        loadPost(entry.file);
                    };

                    li.appendChild(a);
                    listEl.appendChild(li);
                });

                // Load initial post from hash or the latest one
                const hash = window.location.hash ? decodeURIComponent(window.location.hash.replace('#', '')) : '';
                if (hash) {
                    loadPost(hash);
                } else {
                    loadPost(entries[0].file);
                    window.location.hash = encodeURIComponent(entries[0].file);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('entries-list').innerHTML = '<li class="text-red-400 text-sm">Error loading posts.</li>';
            }
        }

        async function loadPost(filename) {
            const contentEl = document.getElementById('content');
            contentEl.innerHTML = '<div class="flex justify-center mt-20"><i class="fas fa-circle-notch fa-spin text-3xl text-primary"></i></div>';
            
            try {
                // Remove encoding if passed
                const safeFilename = decodeURIComponent(filename);
                const res = await fetch(`md/${safeFilename}`);
                if (!res.ok) throw new Error('Local post not found (' + res.status + ')');
                
                let mdText = await res.text();
                
                // Se começar com <external>, puxa o conteúdo direto de outro site!
                if (mdText.trim().startsWith('<external>')) {
                    let externalUrl = mdText.replace('<external>', '').trim();
                    
                    // Auto-converte links amigáveis do GitHub/GitLab para raw (texto puro) pra não dar erro!
                    if (externalUrl.includes('github.com') && externalUrl.includes('/blob/')) {
                        externalUrl = externalUrl.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
                    } else if (externalUrl.includes('gitlab.com') && externalUrl.includes('/-/blob/')) {
                        externalUrl = externalUrl.replace('/-/blob/', '/-/raw/');
                    }
                    
                    // Usar corsproxy caso o site não permita cross-origin requests
                    if (!externalUrl.includes('githubusercontent.com')) {
                        externalUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(externalUrl);
                    }
                    
                    const extRes = await fetch(externalUrl);
                    if (!extRes.ok) throw new Error('External post failed (' + extRes.status + ')');
                    mdText = await extRes.text();
                }
                
                const rawHtml = marked.parse(mdText);
                const safeHtml = DOMPurify.sanitize(rawHtml);
                
                contentEl.innerHTML = safeHtml;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                // Update active state in sidebar
                document.querySelectorAll('#entries-list a').forEach(a => {
                    if (decodeURIComponent(a.getAttribute('href').replace('#','')) === safeFilename) {
                        a.classList.add('border-l-2', 'border-primary', 'bg-slate-800/50');
                        a.querySelector('.font-medium').classList.add('text-primary');
                        a.querySelector('.font-medium').classList.remove('text-white');
                    } else {
                        a.classList.remove('border-l-2', 'border-primary', 'bg-slate-800/50');
                        a.querySelector('.font-medium').classList.remove('text-primary');
                        a.querySelector('.font-medium').classList.add('text-white');
                    }
                });

            } catch (err) {
                console.error(err);
                contentEl.innerHTML = `
                    <div class="text-center mt-10">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                        <h2 class="text-xl font-bold text-white">Error loading post</h2>
                        <p class="text-slate-400 mt-2">${err.message}</p>
                    </div>
                `;
            }
        }

        init();
    </script>
</body>
</html>
