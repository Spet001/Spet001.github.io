<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DELICIA DOOM (UZDoom)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #c0c0c0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        #canvas-wrap {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            z-index: 1;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            cursor: crosshair;
        }

        /* Classic DOS / Zandronum Startup Screen */
        #boot-overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #boot-overlay.hidden {
            display: none;
        }

        .dos-window {
            width: 100%;
            max-width: 680px;
            background: #000000;
            border: 2px solid #555555;
        }

        .dos-header {
            background: #800000;
            color: #ffff55;
            text-align: center;
            padding: 4px 8px;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 2px solid #555555;
        }

        .dos-body {
            padding: 14px 16px;
            color: #aaaaaa;
            line-height: 1.45;
            font-size: 13px;
        }

        .dos-log {
            height: 220px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            color: #aaaaaa;
            margin-bottom: 12px;
        }

        .dos-log .hl {
            color: #ffffff;
        }

        .dos-log .warn {
            color: #ffff55;
        }

        .dos-divider {
            border-top: 1px solid #444444;
            margin: 10px 0;
        }

        .dos-status-row {
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .dos-bar-wrap {
            width: 100%;
            height: 14px;
            background: #1a1a1a;
            border: 1px solid #555555;
            margin-bottom: 14px;
        }

        .dos-bar-fill {
            height: 100%;
            width: 0%;
            background: #aa0000;
        }

        .dos-action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .dos-controls {
            color: #777777;
            font-size: 12px;
        }

        .dos-btn {
            background: #800000;
            color: #ffff55;
            border: 2px solid #aa0000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 7px 18px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dos-btn:hover:not(:disabled) {
            background: #aa0000;
            color: #ffffff;
            border-color: #ffff55;
        }

        .dos-btn:disabled {
            background: #1a1a1a;
            color: #555555;
            border-color: #333333;
            cursor: wait;
        }

        .dos-footer {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #2a2a2a;
            font-size: 11px;
            color: #555555;
            display: flex;
            justify-content: space-between;
        }

        .dos-footer a {
            color: #777777;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="canvas-wrap">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div id="boot-overlay">
        <div class="dos-window">
            <div id="dos-header-title" class="dos-header">
                DOOM II: Hell on Earth - DELICIA MOD (UZDoom v4.12)
            </div>
            <div class="dos-body">
                <div id="dos-log" class="dos-log"></div>

                <div class="dos-divider"></div>

                <div class="dos-status-row">
                    <span id="progress-text">W_Init: Loading WAD &amp; Engine...</span>
                    <span id="progress-pct">0%</span>
                </div>
                <div class="dos-bar-wrap">
                    <div id="progress-fill" class="dos-bar-fill"></div>
                </div>

                <div class="dos-action-row">
                    <div class="dos-controls">
                        WASD: Move | Mouse: Look/Fire | E/Space: Use | ESC: Menu
                    </div>
                    <button id="launch-btn" class="dos-btn" disabled>
                        LOADING...
                    </button>
                </div>

                <div class="dos-footer">
                    <span id="dos-footer-copy">DOOM II (c) 1994 id Software | Engine: UZDoom (GPLv3)</span>
                    <a href="./NOTICE.MD" target="_blank" rel="noopener noreferrer">NOTICE.MD</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function patchAudioContext() {
            const contexts = [];
            const OrigAudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!OrigAudioCtx) return;
            function WrappedAudioContext(...args) {
                const ctx = new OrigAudioCtx(...args);
                contexts.push(ctx);
                return ctx;
            }
            WrappedAudioContext.prototype = OrigAudioCtx.prototype;
            Object.setPrototypeOf(WrappedAudioContext, OrigAudioCtx);
            window.AudioContext = WrappedAudioContext;
            if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext;
            window.__resumeAllAudio = () => {
                for (const c of contexts) {
                    if (c && c.state === 'suspended') {
                        c.resume().catch(() => {});
                    }
                }
            };
            ['pointerdown', 'keydown', 'click'].forEach(ev => {
                window.addEventListener(ev, () => window.__resumeAllAudio(), { passive: true });
            });
        })();
    </script>

    <script src="./engine/uzdoom.js"></script>
    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const hashMode = (window.location.hash || '').replace(/^#/, '').trim().toLowerCase();
            let storageMode = '';
            try {
                storageMode = (sessionStorage.getItem('spet_doom_mode') || localStorage.getItem('spet_doom_mode') || '').trim().toLowerCase();
            } catch (e) {}
            const rawMode = (urlParams.get('mode') || hashMode || storageMode || 'delicia').toLowerCase();

            const MODE_CONFIGS = {
                delicia: {
                    title: 'DELICIA DOOM (UZDoom)',
                    header: 'DOOM II: Hell on Earth - DELICIA MOD (UZDoom v4.12)',
                    footer: 'DOOM II (c) 1994 id Software | Mod: Pai de Familia TC | Engine: UZDoom (GPLv3)',
                    wadUrl: './doom2.WAD',
                    wadLabel: 'doom2.WAD (Delicia Mod Total Conversion)',
                    cacheKey: null,
                    expectedBytes: 17825477,
                    vfsIwad: '/wads/doom2.wad',
                    isDeliciaTC: true,
                    extraArgs: ['-nowidescreen', '-iwad', '/wads/doom2.wad', '-file', '/wads/delicia.wad']
                },
                e1m1: {
                    title: 'DOOM - E1M1: Phobos (UZDoom)',
                    header: 'The Ultimate DOOM - E1M1: Hangar [Phobos] (UZDoom v4.12)',
                    footer: 'The Ultimate DOOM (c) 1993 id Software | Engine: UZDoom (GPLv3)',
                    wadUrl: 'https://raw.githubusercontent.com/Akbar30Bill/DOOM_wads/master/doomu.wad',
                    wadLabel: 'doomu.wad (The Ultimate DOOM IWAD)',
                    cacheKey: 'doomu.wad',
                    expectedBytes: 12408292,
                    vfsIwad: '/wads/doomu.wad',
                    isDeliciaTC: false,
                    extraArgs: ['-iwad', '/wads/doomu.wad', '-skill', '3', '-warp', '1', '1', '+map', 'E1M1']
                },
                e2m1: {
                    title: 'DOOM - E2M1: Deimos (UZDoom)',
                    header: 'The Ultimate DOOM - E2M1: Deimos Anomaly (UZDoom v4.12)',
                    footer: 'The Ultimate DOOM (c) 1993 id Software | Engine: UZDoom (GPLv3)',
                    wadUrl: 'https://raw.githubusercontent.com/Akbar30Bill/DOOM_wads/master/doomu.wad',
                    wadLabel: 'doomu.wad (The Ultimate DOOM IWAD)',
                    cacheKey: 'doomu.wad',
                    expectedBytes: 12408292,
                    vfsIwad: '/wads/doomu.wad',
                    isDeliciaTC: false,
                    extraArgs: ['-iwad', '/wads/doomu.wad', '-skill', '3', '-warp', '2', '1', '+map', 'E2M1']
                },
                doom2: {
                    title: 'DOOM II: Hell on Earth (UZDoom)',
                    header: 'DOOM II: Hell on Earth - MAP01: Entryway [Earth] (UZDoom v4.12)',
                    footer: 'DOOM II: Hell on Earth (c) 1994 id Software | Engine: UZDoom (GPLv3)',
                    wadUrl: 'https://raw.githubusercontent.com/Akbar30Bill/DOOM_wads/master/doom2.wad',
                    wadLabel: 'doom2.wad (DOOM II: Hell on Earth IWAD)',
                    cacheKey: 'doom2_vanilla.wad',
                    expectedBytes: 14604584,
                    vfsIwad: '/wads/doom2.wad',
                    isDeliciaTC: false,
                    extraArgs: ['-iwad', '/wads/doom2.wad', '-skill', '3', '-warp', '1', '+map', 'MAP01']
                },
                project115: {
                    title: 'PROJECT 115: DESPAIR (COD Zombies in DOOM · UZDoom)',
                    header: 'PROJECT 115: DESPAIR FINAL - COD Zombies in DOOM (UZDoom v4.12)',
                    footer: 'Project 115: Despair (c) 2016-2018 Fabysk | Engine: UZDoom (GPLv3) | id Software',
                    wadUrl: './doom2.WAD',
                    wadLabel: 'doom2.WAD (DOOM II Base IWAD)',
                    cacheKey: null,
                    expectedBytes: 17825477,
                    vfsIwad: '/wads/doom2.wad',
                    isDeliciaTC: false,
                    isProject115: true,
                    pwadVfs: '/wads/project115.wad',
                    pwadCacheKey: 'project115_despair.wad',
                    pwadUrl: '/wads/project115.wad',
                    pwadRemoteUrl: 'https://github.com/Spet001/Project-115-Despair/releases/download/v1.0.0/Project115.wad',
                    expectedPwadBytes: 511013754,
                    extraArgs: [
                        '-nowidescreen',
                        '-iwad', '/wads/doom2.wad',
                        '-file', '/wads/project115.wad'
                    ]
                }
            };

            const cfg = MODE_CONFIGS[rawMode] || MODE_CONFIGS.delicia;
            document.title = cfg.title;

            const canvas = document.getElementById('canvas');
            const overlay = document.getElementById('boot-overlay');
            const launchBtn = document.getElementById('launch-btn');
            const progressText = document.getElementById('progress-text');
            const progressPct = document.getElementById('progress-pct');
            const progressFill = document.getElementById('progress-fill');
            const dosLog = document.getElementById('dos-log');
            const dosHeaderTitle = document.getElementById('dos-header-title');
            const dosFooterCopy = document.getElementById('dos-footer-copy');

            if (dosHeaderTitle) dosHeaderTitle.textContent = cfg.header;
            if (dosFooterCopy) dosFooterCopy.textContent = cfg.footer;

            let enginePct = 0;
            let wadPct = 0;
            let pwadPct = 0;
            let engineReady = false;
            let wadReady = false;
            let pwadReady = !cfg.isProject115;
            let engineInstance = null;
            let wadBytes = null;
            let pwadBytes = null;
            let hasLaunched = false;
            let autoLaunchRequested = false;

            const IDB_NAME = 'SPET_DOOM_WAD_CACHE';
            const IDB_STORE = 'wads';

            function openWadCacheDB() {
                return new Promise((resolve, reject) => {
                    if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
                    const req = indexedDB.open(IDB_NAME, 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(IDB_STORE)) {
                            db.createObjectStore(IDB_STORE);
                        }
                    };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e.target.error || new Error('IDB open error'));
                });
            }

            async function getCachedWad(key) {
                if (!key) return null;
                try {
                    const db = await openWadCacheDB();
                    return await new Promise((resolve) => {
                        const tx = db.transaction(IDB_STORE, 'readonly');
                        const store = tx.objectStore(IDB_STORE);
                        const req = store.get(key);
                        req.onsuccess = () => {
                            const res = req.result;
                            if (!res) return resolve(null);
                            const arr = res instanceof Uint8Array ? res : new Uint8Array(res);
                            resolve(arr.byteLength > 1000000 ? arr : null);
                        };
                        req.onerror = () => resolve(null);
                    });
                } catch (e) {
                    return null;
                }
            }

            async function setCachedWad(key, bytes) {
                if (!key || !bytes) return;
                try {
                    const db = await openWadCacheDB();
                    await new Promise((resolve) => {
                        const tx = db.transaction(IDB_STORE, 'readwrite');
                        const store = tx.objectStore(IDB_STORE);
                        store.put(bytes, key);
                        tx.oncomplete = () => resolve();
                        tx.onerror = () => resolve();
                    });
                } catch (e) {}
            }

            function logLine(text, cls) {
                const line = document.createElement('div');
                if (cls) line.className = cls;
                line.textContent = text;
                dosLog.appendChild(line);
                dosLog.scrollTop = dosLog.scrollHeight;
            }

            logLine('UZDoom v4.12.2 - WebAssembly Port (SDL2 / WebGL2)', 'hl');
            logLine('M_LoadDefaults: Load system defaults.');
            logLine('Z_Init: Init zone memory allocation daemon.');
            logLine('W_Init: Init WADfiles.');

            function updateOverallProgress(customMsg) {
                let total = 0;
                if (cfg.isProject115) {
                    total = Math.min(100, Math.round(enginePct * 0.2 + wadPct * 0.1 + pwadPct * 0.7));
                } else {
                    total = Math.min(100, Math.round(enginePct * 0.6 + wadPct * 0.4));
                }
                progressFill.style.width = total + '%';
                progressPct.textContent = total + '%';
                if (customMsg) {
                    progressText.textContent = customMsg;
                }
            }

            function checkBothReady() {
                if (engineReady && wadReady && pwadReady && !hasLaunched) {
                    logLine('R_Init: Init DOOM refresh daemon - Complete.');
                    logLine('P_Init: Init Playloop state.');
                    logLine('S_Init: Setting up sound (OGG Vorbis / FluidSynth).');
                    logLine('Ready. Press ENTER or click [START GAME] to launch.', 'warn');
                    updateOverallProgress('Ready.');
                    launchBtn.disabled = false;
                    launchBtn.textContent = '[ START GAME / ENTER ]';
                    if (autoLaunchRequested) {
                        startGame();
                    }
                }
            }

            async function fetchWadWithProgress() {
                try {
                    if (cfg.cacheKey) {
                        logLine(` checking IndexedDB cache for ${cfg.cacheKey}...`);
                        const cached = await getCachedWad(cfg.cacheKey);
                        if (cached) {
                            wadBytes = cached;
                            wadPct = 100;
                            wadReady = true;
                            const mbCached = (cached.byteLength / (1024 * 1024)).toFixed(1);
                            logLine(`W_Cache: Loaded ${cfg.cacheKey} from local IndexedDB (${mbCached} MB).`, 'hl');
                            logLine(` adding ${cfg.vfsIwad}`, 'hl');
                            updateOverallProgress(`Loaded ${cfg.cacheKey} from cache.`);
                        }
                    }

                    if (!wadReady) {
                        logLine(` fetch ${cfg.wadLabel}...`);
                        const resp = await fetch(cfg.wadUrl);
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        const total = Number(resp.headers.get('Content-Length')) || cfg.expectedBytes;
                        const reader = resp.body.getReader();
                        const buf = new Uint8Array(total);
                        let loaded = 0;
                        let chunks = [];

                        for (;;) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            if (loaded + value.byteLength <= buf.byteLength) {
                                buf.set(value, loaded);
                            } else {
                                chunks.push(value);
                            }
                            loaded += value.byteLength;
                            wadPct = Math.min(100, (loaded / total) * 100);
                            const mbLoaded = (loaded / (1024 * 1024)).toFixed(1);
                            const mbTotal = (total / (1024 * 1024)).toFixed(1);
                            updateOverallProgress(`Downloading base IWAD (${mbLoaded}/${mbTotal} MB)...`);
                        }

                        if (chunks.length > 0 || loaded !== buf.byteLength) {
                            const full = new Uint8Array(loaded);
                            full.set(buf.subarray(0, Math.min(loaded, buf.byteLength)), 0);
                            let offset = Math.min(loaded, buf.byteLength);
                            for (const c of chunks) {
                                full.set(c, offset);
                                offset += c.byteLength;
                            }
                            wadBytes = full;
                        } else {
                            wadBytes = buf;
                        }

                        if (wadBytes.length > 4) {
                            wadBytes[0] = 73; // 'I'
                            wadBytes[1] = 87; // 'W'
                            wadBytes[2] = 65; // 'A'
                            wadBytes[3] = 68; // 'D'
                        }

                        if (cfg.cacheKey) {
                            await setCachedWad(cfg.cacheKey, wadBytes);
                            logLine(`W_Cache: Saved ${cfg.cacheKey} to browser IndexedDB.`, 'hl');
                        }

                        wadPct = 100;
                        wadReady = true;
                        logLine(` adding ${cfg.vfsIwad}`, 'hl');
                        if (cfg.isDeliciaTC) {
                            logLine(' adding /wads/delicia.wad (PWAD override)', 'hl');
                        }
                    }

                    checkBothReady();

                    if (cfg.isProject115) {
                        await loadProject115Pwad();
                    }
                } catch (err) {
                    console.error('[UZDoom] WAD fetch failed:', err);
                    logLine('W_Init Error: ' + err.message, 'warn');
                    progressText.textContent = 'Error loading WAD: ' + err.message;
                }
            }

            async function loadProject115Pwad() {
                

                logLine(` checking IndexedDB cache for ${cfg.pwadCacheKey}...`);
                const cachedPwad = await getCachedWad(cfg.pwadCacheKey);
                if (cachedPwad) {
                    pwadBytes = cachedPwad;
                    pwadPct = 100;
                    pwadReady = true;
                    const mbCached = (cachedPwad.byteLength / (1024 * 1024)).toFixed(1);
                    logLine(`W_Cache: Loaded ${cfg.pwadCacheKey} from local IndexedDB (${mbCached} MB).`, 'hl');
                    logLine(` adding ${cfg.pwadVfs}`, 'hl');
                    updateOverallProgress('Project 115 WAD pronto.');
                    checkBothReady();
                    return;
                }

                try {
                    logLine(' fetch Project 115 PWAD (local / remote stream)...');
                    let resp = await fetch(cfg.pwadUrl).catch(() => null);
                    if ((!resp || !resp.ok) && cfg.pwadRemoteUrl) {
                        logLine(' attempting fetch from release mirror: ' + cfg.pwadRemoteUrl, 'hl');
                        resp = await fetch(cfg.pwadRemoteUrl).catch(() => null);
                    }
                    if (resp && resp.ok) {
                        const total = Number(resp.headers.get('Content-Length')) || cfg.expectedPwadBytes;
                        const reader = resp.body.getReader();
                        const buf = new Uint8Array(total);
                        let loaded = 0;
                        let chunks = [];

                        for (;;) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            if (loaded + value.byteLength <= buf.byteLength) {
                                buf.set(value, loaded);
                            } else {
                                chunks.push(value);
                            }
                            loaded += value.byteLength;
                            pwadPct = Math.min(100, (loaded / total) * 100);
                            const mbLoaded = (loaded / (1024 * 1024)).toFixed(1);
                            const mbTotal = (total / (1024 * 1024)).toFixed(1);
                            updateOverallProgress(`Downloading Project 115 (${mbLoaded}/${mbTotal} MB)...`);
                        }

                        if (chunks.length > 0 || loaded !== buf.byteLength) {
                            const full = new Uint8Array(loaded);
                            full.set(buf.subarray(0, Math.min(loaded, buf.byteLength)), 0);
                            let offset = Math.min(loaded, buf.byteLength);
                            for (const c of chunks) {
                                full.set(c, offset);
                                offset += c.byteLength;
                            }
                            pwadBytes = full;
                        } else {
                            pwadBytes = buf;
                        }

                        pwadPct = 100;
                        pwadReady = true;
                        await setCachedWad(cfg.pwadCacheKey, pwadBytes);
                        logLine(`W_Cache: Salvo ${cfg.pwadCacheKey} no IndexedDB (${(pwadBytes.byteLength / (1024 * 1024)).toFixed(1)} MB).`, 'hl');
                        logLine(` adding ${cfg.pwadVfs}`, 'hl');
                        checkBothReady();
                        return;
                    }
                } catch (e) {
                    console.warn('[UZDoom] Auto-fetch of Project 115 failed, displaying file picker fallback:', e);
                }

                updateOverallProgress('Aguardando Project 115 WAD...');
            }

            

            async function bootstrapEngine() {
                try {
                    const factory = window.createUZDoom || window.Module;
                    if (typeof factory !== 'function') {
                        throw new Error('UZDoom factory not found');
                    }

                    const HOME = '/userdata/profiles/default';
                    const WAD_DIR = '/wads';

                    const moduleConfig = {
                        thisProgram: '/uzdoom/uzdoom',
                        locateFile: (name) => './engine/' + name,
                        canvas: canvas,
                        noInitialRun: true,
                        print: (msg) => console.log('[UZDoom]', msg),
                        printErr: (msg) => console.warn('[UZDoom]', msg),
                        setStatus: (msg) => {
                            if (!msg) return;
                            const m = msg.match(/\((\d+)\s*\/\s*(\d+)\)/);
                            if (m) {
                                const frac = Number(m[1]) / Math.max(1, Number(m[2]));
                                enginePct = Math.min(95, frac * 95);
                                updateOverallProgress('Loading uzdoom.wasm & uzdoom.pk3...');
                            }
                        },
                        preRun: [
                            function applyEnv(M) {
                                Object.assign(M.ENV, { HOME, DOOMWADDIR: WAD_DIR });
                            },
                            function mountFS(M) {
                                M.addRunDependency('delicia-fs');
                                try { M.FS.mkdirTree('/userdata/profiles/default/saves'); } catch (e) {}
                                try { M.FS.mkdirTree(WAD_DIR); } catch (e) {}
                                try {
                                    M.FS.mount(M.FS.filesystems.IDBFS, { root: '/' }, '/userdata');
                                    M.FS.syncfs(true, () => {
                                        try { M.FS.mkdirTree('/userdata/profiles/default/saves'); } catch (e) {}
                                        M.removeRunDependency('delicia-fs');
                                    });
                                } catch (e) {
                                    M.removeRunDependency('delicia-fs');
                                }
                            }
                        ]
                    };

                    const M = await factory(moduleConfig);
                    M.callbacks = {
                        onReady: () => console.log('[UZDoom] Engine Ready'),
                        onFileWrite: () => {
                            try { M.FS.syncfs(false, () => {}); } catch (e) {}
                        }
                    };
                    engineInstance = M;
                    enginePct = 100;
                    engineReady = true;
                    logLine(' adding /uzdoom/uzdoom.pk3', 'hl');
                    logLine(' adding /uzdoom/game_support.pk3', 'hl');
                    checkBothReady();
                } catch (err) {
                    console.error('[UZDoom] Engine bootstrap failed:', err);
                    logLine('I_Init Error: ' + err.message, 'warn');
                    progressText.textContent = 'Error initializing UZDoom: ' + err.message;
                }
            }

            function startGame() {
                if (hasLaunched || !engineInstance || !wadBytes) return;
                hasLaunched = true;

                if (window.__resumeAllAudio) window.__resumeAllAudio();

                const M = engineInstance;
                const HOME = '/userdata/profiles/default';
                const SAVE_DIR = '/userdata/profiles/default/saves';

                try { M.FS.mkdirTree(HOME); } catch (e) {}
                try { M.FS.mkdirTree(SAVE_DIR); } catch (e) {}
                try { M.FS.mkdirTree('/wads'); } catch (e) {}

                M.FS.writeFile(cfg.vfsIwad, wadBytes);

                if (cfg.isDeliciaTC) {
                    const pwadBytes = new Uint8Array(wadBytes);
                    if (pwadBytes.length > 4) {
                        pwadBytes[0] = 80; // 'P'
                        pwadBytes[1] = 87; // 'W'
                        pwadBytes[2] = 65; // 'A'
                        pwadBytes[3] = 68; // 'D'
                    }
                    M.FS.writeFile('/wads/delicia.wad', pwadBytes);
                    try { M.FS.unlink('/uzdoom/game_widescreen_gfx.pk3'); } catch (e) {}
                }

                if (cfg.isProject115 && pwadBytes) {
                    M.FS.writeFile('/wads/project115.wad', pwadBytes);
                    pwadBytes = null;
                }
                wadBytes = null;

                try { M.FS.chdir(HOME); } catch (e) {}
                const defaultIni = [
                    '[GlobalSettings]',
                    'language=en-US',
                    'cl_gfxlocalization=0',
                    'autoloadwidescreen=false',
                    'vid_fullscreen=false',
                    'gl_texture_filter=0',
                    'gl_texture_filter_anisotropic=1',
                    ''
                ].join('\n');
                try {
                    let existingIni = M.FS.readFile(HOME + '/uzdoom.ini', { encoding: 'utf8' });
                    if (!existingIni || !existingIni.includes('cl_gfxlocalization=0')) {
                        M.FS.writeFile(HOME + '/uzdoom.ini', defaultIni, { encoding: 'utf8' });
                    }
                } catch (e) {
                    M.FS.writeFile(HOME + '/uzdoom.ini', defaultIni, { encoding: 'utf8' });
                }

                const dpr = window.devicePixelRatio || 1;
                let w = Math.round(Math.max(640, Math.min(1920, window.innerWidth * dpr)));
                let h = Math.round(Math.max(400, Math.min(1080, window.innerHeight * dpr)));
                if (w & 1) w--;
                if (h & 1) h--;
                canvas.width = w;
                canvas.height = h;

                overlay.classList.add('hidden');
                canvas.focus();

                const argv = [
                    '-config', 'uzdoom.ini',
                    '-savedir', SAVE_DIR,
                    '+set', 'autoloadwidescreen', '0',
                    '+set', 'cl_gfxlocalization', '0',
                    '+set', 'language', 'en-US',
                    '+set', 'vid_fullscreen', '0',
                    '+set', 'gl_texture_filter', '0',
                    '+set', 'gl_texture_filter_anisotropic', '1',
                    '-width', String(w),
                    '-height', String(h),
                    ...cfg.extraArgs
                ];

                try {
                    M.callMain(argv);
                } catch (err) {
                    const s = String(err);
                    if (s.indexOf('unwind') === -1 && s.indexOf('SimulateInfiniteLoop') === -1) {
                        console.error('[UZDoom] callMain error:', err);
                    }
                }
            }

            launchBtn.addEventListener('click', () => {
                if (window.__resumeAllAudio) window.__resumeAllAudio();
                if (engineReady && wadReady) {
                    startGame();
                } else {
                    autoLaunchRequested = true;
                    launchBtn.textContent = 'STARTING...';
                }
            });

            window.addEventListener('keydown', (e) => {
                if (!hasLaunched && engineReady && wadReady && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    startGame();
                }
            });

            canvas.addEventListener('click', () => {
                if (window.__resumeAllAudio) window.__resumeAllAudio();
                canvas.focus();
            });

            fetchWadWithProgress();
            bootstrapEngine();
        })();
    </script>
</body>
</html>
