<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DELICIA DOOM (UZDoom)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #c0c0c0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        #canvas-wrap {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            z-index: 1;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            cursor: crosshair;
        }

        /* Classic DOS / Zandronum Startup Screen */
        #boot-overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #boot-overlay.hidden {
            display: none;
        }

        .dos-window {
            width: 100%;
            max-width: 680px;
            background: #000000;
            border: 2px solid #555555;
        }

        .dos-header {
            background: #800000;
            color: #ffff55;
            text-align: center;
            padding: 4px 8px;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 2px solid #555555;
        }

        .dos-body {
            padding: 14px 16px;
            color: #aaaaaa;
            line-height: 1.45;
            font-size: 13px;
        }

        .dos-log {
            height: 220px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            color: #aaaaaa;
            margin-bottom: 12px;
        }

        .dos-log .hl {
            color: #ffffff;
        }

        .dos-log .warn {
            color: #ffff55;
        }

        .dos-divider {
            border-top: 1px solid #444444;
            margin: 10px 0;
        }

        .dos-status-row {
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .dos-bar-wrap {
            width: 100%;
            height: 14px;
            background: #1a1a1a;
            border: 1px solid #555555;
            margin-bottom: 14px;
        }

        .dos-bar-fill {
            height: 100%;
            width: 0%;
            background: #aa0000;
        }

        .dos-action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .dos-controls {
            color: #777777;
            font-size: 12px;
        }

        .dos-btn {
            background: #800000;
            color: #ffff55;
            border: 2px solid #aa0000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            padding: 7px 18px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dos-btn:hover:not(:disabled) {
            background: #aa0000;
            color: #ffffff;
            border-color: #ffff55;
        }

        .dos-btn:disabled {
            background: #1a1a1a;
            color: #555555;
            border-color: #333333;
            cursor: wait;
        }

        .dos-footer {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #2a2a2a;
            font-size: 11px;
            color: #555555;
            display: flex;
            justify-content: space-between;
        }

        .dos-footer a {
            color: #777777;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="canvas-wrap">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div id="boot-overlay">
        <div class="dos-window">
            <div class="dos-header">
                DOOM II: Hell on Earth - DELICIA MOD (UZDoom v4.12)
            </div>
            <div class="dos-body">
                <div id="dos-log" class="dos-log"></div>

                <div class="dos-divider"></div>

                <div class="dos-status-row">
                    <span id="progress-text">W_Init: Loading WAD &amp; Engine...</span>
                    <span id="progress-pct">0%</span>
                </div>
                <div class="dos-bar-wrap">
                    <div id="progress-fill" class="dos-bar-fill"></div>
                </div>

                <div class="dos-action-row">
                    <div class="dos-controls">
                        WASD: Move | Mouse: Look/Fire | E/Space: Use | ESC: Menu
                    </div>
                    <button id="launch-btn" class="dos-btn" disabled>
                        LOADING...
                    </button>
                </div>

                <div class="dos-footer">
                    <span>DOOM II (c) 1994 id Software | Engine: UZDoom (GPLv3)</span>
                    <a href="./NOTICE.MD" target="_blank" rel="noopener noreferrer">NOTICE.MD</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function patchAudioContext() {
            const contexts = [];
            const OrigAudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!OrigAudioCtx) return;
            function WrappedAudioContext(...args) {
                const ctx = new OrigAudioCtx(...args);
                contexts.push(ctx);
                return ctx;
            }
            WrappedAudioContext.prototype = OrigAudioCtx.prototype;
            Object.setPrototypeOf(WrappedAudioContext, OrigAudioCtx);
            window.AudioContext = WrappedAudioContext;
            if (window.webkitAudioContext) window.webkitAudioContext = WrappedAudioContext;
            window.__resumeAllAudio = () => {
                for (const c of contexts) {
                    if (c && c.state === 'suspended') {
                        c.resume().catch(() => {});
                    }
                }
            };
            ['pointerdown', 'keydown', 'click'].forEach(ev => {
                window.addEventListener(ev, () => window.__resumeAllAudio(), { passive: true });
            });
        })();
    </script>

    <script src="./engine/uzdoom.js"></script>
    <script>
        (function () {
            const canvas = document.getElementById('canvas');
            const overlay = document.getElementById('boot-overlay');
            const launchBtn = document.getElementById('launch-btn');
            const progressText = document.getElementById('progress-text');
            const progressPct = document.getElementById('progress-pct');
            const progressFill = document.getElementById('progress-fill');
            const dosLog = document.getElementById('dos-log');

            let enginePct = 0;
            let wadPct = 0;
            let engineReady = false;
            let wadReady = false;
            let engineInstance = null;
            let wadBytes = null;
            let hasLaunched = false;
            let autoLaunchRequested = false;

            function logLine(text, cls) {
                const line = document.createElement('div');
                if (cls) line.className = cls;
                line.textContent = text;
                dosLog.appendChild(line);
                dosLog.scrollTop = dosLog.scrollHeight;
            }

            logLine('UZDoom v4.12.2 - WebAssembly Port (SDL2 / WebGL2)', 'hl');
            logLine('M_LoadDefaults: Load system defaults.');
            logLine('Z_Init: Init zone memory allocation daemon.');
            logLine('W_Init: Init WADfiles.');

            function updateOverallProgress(customMsg) {
                const total = Math.min(100, Math.round(enginePct * 0.6 + wadPct * 0.4));
                progressFill.style.width = total + '%';
                progressPct.textContent = total + '%';
                if (customMsg) {
                    progressText.textContent = customMsg;
                }
            }

            function checkBothReady() {
                if (engineReady && wadReady && !hasLaunched) {
                    logLine('R_Init: Init DOOM refresh daemon - Complete.');
                    logLine('P_Init: Init Playloop state.');
                    logLine('S_Init: Setting up sound (OGG Vorbis / FluidSynth).');
                    logLine('Ready. Press ENTER or click [START GAME] to launch.', 'warn');
                    updateOverallProgress('Ready.');
                    launchBtn.disabled = false;
                    launchBtn.textContent = '[ START GAME / ENTER ]';
                    if (autoLaunchRequested) {
                        startGame();
                    }
                }
            }

            async function fetchWadWithProgress() {
                try {
                    logLine(' fetch ./doom2.WAD (Delicia Mod Total Conversion)...');
                    const resp = await fetch('./doom2.WAD');
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const total = Number(resp.headers.get('Content-Length')) || 17825477;
                    const reader = resp.body.getReader();
                    const buf = new Uint8Array(total);
                    let loaded = 0;
                    let chunks = [];

                    for (;;) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (loaded + value.byteLength <= buf.byteLength) {
                            buf.set(value, loaded);
                        } else {
                            chunks.push(value);
                        }
                        loaded += value.byteLength;
                        wadPct = Math.min(100, (loaded / total) * 100);
                        const mbLoaded = (loaded / (1024 * 1024)).toFixed(1);
                        const mbTotal = (total / (1024 * 1024)).toFixed(1);
                        updateOverallProgress(`Reading doom2.WAD (${mbLoaded}/${mbTotal} MB)...`);
                    }

                    if (chunks.length > 0 || loaded !== buf.byteLength) {
                        const full = new Uint8Array(loaded);
                        full.set(buf.subarray(0, Math.min(loaded, buf.byteLength)), 0);
                        let offset = Math.min(loaded, buf.byteLength);
                        for (const c of chunks) {
                            full.set(c, offset);
                            offset += c.byteLength;
                        }
                        wadBytes = full;
                    } else {
                        wadBytes = buf;
                    }

                    if (wadBytes.length > 4) {
                        wadBytes[0] = 73; // 'I'
                        wadBytes[1] = 87; // 'W'
                        wadBytes[2] = 65; // 'A'
                        wadBytes[3] = 68; // 'D'
                    }

                    wadPct = 100;
                    wadReady = true;
                    logLine(' adding /wads/doom2.wad (2925 lumps)', 'hl');
                    logLine(' adding /wads/delicia.wad (PWAD override)', 'hl');
                    checkBothReady();
                } catch (err) {
                    console.error('[DeliciaDoom] WAD fetch failed:', err);
                    logLine('W_Init Error: ' + err.message, 'warn');
                    progressText.textContent = 'Error loading doom2.WAD: ' + err.message;
                }
            }

            async function bootstrapEngine() {
                try {
                    const factory = window.createUZDoom || window.Module;
                    if (typeof factory !== 'function') {
                        throw new Error('UZDoom factory not found');
                    }

                    const HOME = '/userdata/profiles/default';
                    const WAD_DIR = '/wads';

                    const moduleConfig = {
                        thisProgram: '/uzdoom/uzdoom',
                        locateFile: (name) => './engine/' + name,
                        canvas: canvas,
                        noInitialRun: true,
                        print: (msg) => console.log('[UZDoom]', msg),
                        printErr: (msg) => console.warn('[UZDoom]', msg),
                        setStatus: (msg) => {
                            if (!msg) return;
                            const m = msg.match(/\((\d+)\s*\/\s*(\d+)\)/);
                            if (m) {
                                const frac = Number(m[1]) / Math.max(1, Number(m[2]));
                                enginePct = Math.min(95, frac * 95);
                                updateOverallProgress('Loading uzdoom.wasm & uzdoom.pk3...');
                            }
                        },
                        preRun: [
                            function applyEnv(M) {
                                Object.assign(M.ENV, { HOME, DOOMWADDIR: WAD_DIR });
                            },
                            function mountFS(M) {
                                M.addRunDependency('delicia-fs');
                                try { M.FS.mkdirTree('/userdata/profiles/default/saves'); } catch (e) {}
                                try { M.FS.mkdirTree(WAD_DIR); } catch (e) {}
                                try {
                                    M.FS.mount(M.FS.filesystems.IDBFS, { root: '/' }, '/userdata');
                                    M.FS.syncfs(true, () => {
                                        try { M.FS.mkdirTree('/userdata/profiles/default/saves'); } catch (e) {}
                                        M.removeRunDependency('delicia-fs');
                                    });
                                } catch (e) {
                                    M.removeRunDependency('delicia-fs');
                                }
                            }
                        ]
                    };

                    const M = await factory(moduleConfig);
                    M.callbacks = {
                        onReady: () => console.log('[DeliciaDoom] Engine Ready'),
                        onFileWrite: () => {
                            try { M.FS.syncfs(false, () => {}); } catch (e) {}
                        }
                    };
                    engineInstance = M;
                    enginePct = 100;
                    engineReady = true;
                    logLine(' adding /uzdoom/uzdoom.pk3', 'hl');
                    logLine(' adding /uzdoom/game_support.pk3', 'hl');
                    checkBothReady();
                } catch (err) {
                    console.error('[DeliciaDoom] Engine bootstrap failed:', err);
                    logLine('I_Init Error: ' + err.message, 'warn');
                    progressText.textContent = 'Error initializing UZDoom: ' + err.message;
                }
            }

            function startGame() {
                if (hasLaunched || !engineInstance || !wadBytes) return;
                hasLaunched = true;

                if (window.__resumeAllAudio) window.__resumeAllAudio();

                const M = engineInstance;
                const HOME = '/userdata/profiles/default';
                const SAVE_DIR = '/userdata/profiles/default/saves';

                try { M.FS.mkdirTree(HOME); } catch (e) {}
                try { M.FS.mkdirTree(SAVE_DIR); } catch (e) {}
                try { M.FS.mkdirTree('/wads'); } catch (e) {}

                M.FS.writeFile('/wads/doom2.wad', wadBytes);

                const pwadBytes = new Uint8Array(wadBytes);
                if (pwadBytes.length > 4) {
                    pwadBytes[0] = 80; // 'P'
                    pwadBytes[1] = 87; // 'W'
                    pwadBytes[2] = 65; // 'A'
                    pwadBytes[3] = 68; // 'D'
                }
                M.FS.writeFile('/wads/delicia.wad', pwadBytes);
                wadBytes = null;

                try { M.FS.unlink('/uzdoom/game_widescreen_gfx.pk3'); } catch (e) {}

                try { M.FS.chdir(HOME); } catch (e) {}
                const defaultIni = [
                    '[GlobalSettings]',
                    'language=en-US',
                    'cl_gfxlocalization=0',
                    'autoloadwidescreen=false',
                    'vid_fullscreen=false',
                    'gl_texture_filter=0',
                    'gl_texture_filter_anisotropic=1',
                    ''
                ].join('\n');
                try {
                    let existingIni = M.FS.readFile(HOME + '/uzdoom.ini', { encoding: 'utf8' });
                    if (!existingIni || !existingIni.includes('cl_gfxlocalization=0')) {
                        M.FS.writeFile(HOME + '/uzdoom.ini', defaultIni, { encoding: 'utf8' });
                    }
                } catch (e) {
                    M.FS.writeFile(HOME + '/uzdoom.ini', defaultIni, { encoding: 'utf8' });
                }

                const dpr = window.devicePixelRatio || 1;
                let w = Math.round(Math.max(640, Math.min(1920, window.innerWidth * dpr)));
                let h = Math.round(Math.max(400, Math.min(1080, window.innerHeight * dpr)));
                if (w & 1) w--;
                if (h & 1) h--;
                canvas.width = w;
                canvas.height = h;

                overlay.classList.add('hidden');
                canvas.focus();

                const argv = [
                    '-config', 'uzdoom.ini',
                    '-savedir', SAVE_DIR,
                    '-nowidescreen',
                    '+set', 'autoloadwidescreen', '0',
                    '+set', 'cl_gfxlocalization', '0',
                    '+set', 'language', 'en-US',
                    '+set', 'vid_fullscreen', '0',
                    '+set', 'gl_texture_filter', '0',
                    '+set', 'gl_texture_filter_anisotropic', '1',
                    '-width', String(w),
                    '-height', String(h),
                    '-iwad', '/wads/doom2.wad',
                    '-file', '/wads/delicia.wad'
                ];

                try {
                    M.callMain(argv);
                } catch (err) {
                    const s = String(err);
                    if (s.indexOf('unwind') === -1 && s.indexOf('SimulateInfiniteLoop') === -1) {
                        console.error('[DeliciaDoom] callMain error:', err);
                    }
                }
            }

            launchBtn.addEventListener('click', () => {
                if (window.__resumeAllAudio) window.__resumeAllAudio();
                if (engineReady && wadReady) {
                    startGame();
                } else {
                    autoLaunchRequested = true;
                    launchBtn.textContent = 'STARTING...';
                }
            });

            window.addEventListener('keydown', (e) => {
                if (!hasLaunched && engineReady && wadReady && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    startGame();
                }
            });

            canvas.addEventListener('click', () => {
                if (window.__resumeAllAudio) window.__resumeAllAudio();
                canvas.focus();
            });

            fetchWadWithProgress();
            bootstrapEngine();
        })();
    </script>
</body>
</html>
